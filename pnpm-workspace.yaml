allowBuilds:
  # KAN-322: postinstall descarga el binario oficial de sentry-cli (github.com/getsentry/sentry-cli)
  # desde los release servers de Sentry — lo necesita `withSentryConfig` (next.config.ts) para subir
  # source maps en el build de producción cuando `SENTRY_AUTH_TOKEN` está seteado.
  "@sentry/cli": true
  sharp: false
  unrs-resolver: false

# Hardening de supply-chain (react-doctor/require-pnpm-hardening)
minimumReleaseAge: 2880 # 2 días — la mayoría de los paquetes maliciosos se detectan y despublican en <48h; un valor mayor (p. ej. 7 días) bloqueaba el install de Next.js recién publicado
trustPolicy: no-downgrade # rechaza actualizaciones que debiliten señales de confianza (provenance/firmas)
trustPolicyIgnoreAfter: 525600 # 1 año — evita falsos positivos en paquetes viejos y estables publicados antes de que existiera provenance en npm
